name: Обновление маршрутов

on:
  schedule:
    # 1-го и 15-го числа каждого месяца в 00:00 UTC
    - cron: '0 0 1,15 * *'
  # Ручной запуск через интерфейс GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run update script
        env:
          OPENSKY_CLIENT_ID:     ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          AIRLABS_KEY:           ${{ secrets.AIRLABS_KEY }}
          AERODATABOX_KEY:       ${{ secrets.AERODATABOX_KEY }}
          YANDEX_RASP_KEY:       ${{ secrets.YANDEX_RASP_KEY }}
        # 50 мин — внутренний timeout обязан сработать раньше timeout-minutes
        # джобы (60), иначе GitHub убьёт джобу целиком и шаг коммита не выполнится.
        # Падение/таймаут скрипта делает шаг красным (видно в Actions),
        # но частичные результаты всё равно коммитятся — см. if: always() ниже.
        run: |
          timeout 3000 python update_routes.py

      - name: Актуализировать визовые режимы (ru.wikipedia, отпатрулированная версия)
        # Берётся стабильная (проверенная патрулирующим) версия статьи, а не
        # последняя. Порог --max-changes останавливает запись, если за прогон
        # поменялось подозрительно много стран (сломанный парсинг/вандализм) —
        # шаг падает, но красным становится только он, маршруты уже сохранены.
        if: always()
        continue-on-error: true
        run: python scripts/gen_visa_regimes.py

      - name: Обновить детали маршрутов (авиакомпании, аэропорты вылета)
        # Снэпшот Jonty/airline-route-data — без ключа. Держит ROUTE_DETAILS в
        # соответствии с новым составом routes.json: у появившихся маршрутов
        # иначе не было бы ни перевозчиков, ни аэропортов вылета до ручного
        # запуска скрипта.
        if: always()
        continue-on-error: true
        run: python scripts/gen_route_details.py

      - name: Обновить диапазон цен (Travelpayouts Data API)
        # Полный пересчёт на каждый прогон (в отличие от сезонности — цены
        # обязаны быть свежими, а не только у новых направлений). Пара
        # город→направление, для которой запрос не удался или в кэше
        # Travelpayouts нет цены, просто не попадает в PRICE_DATA и будет
        # предпринята заново через 2 недели (см. scripts/gen_price_data.py).
        # Без секрета TRAVELPAYOUTS_TOKEN скрипт молча пропускает шаг —
        # пайплайн не краснеет, пока пользователь не добавил токен.
        if: always()
        continue-on-error: true
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: timeout 900 python scripts/gen_price_data.py

      - name: Досчитать сезонность для новых направлений (Open-Meteo)
        # По умолчанию считает ТОЛЬКО направления, которых ещё нет в SEASON_DATA
        # в index.html — климат стабилен год к году, пересчитывать весь список
        # на каждый прогон незачем. Направление, для которого Open-Meteo не
        # ответил, в SEASON_DATA не попадает и будет повторено в следующий
        # прогон (см. scripts/gen_season_data.py). timeout — чтобы зависшие
        # ретраи не съели бюджет джобы; continue-on-error — чтобы не блокировать
        # остальной пайплайн.
        if: always()
        continue-on-error: true
        run: timeout 600 python scripts/gen_season_data.py

      - name: Обновить текстовый снапшот для краулеров (index.html, sitemap.xml)
        # routes.json сохраняется инкрементально по источникам (см. комментарий
        # ниже), поэтому валиден даже при частичном падении update_routes.py —
        # снапшот пересобираем из того, что есть.
        if: always()
        run: python scripts/gen_static_snapshot.py

      - name: Commit routes.json if changed
        # Скрипт сохраняет routes.json после каждого источника; при падении
        # или таймауте коммитим то, что успело сохраниться (данные не теряются —
        # неопрошенные города сохраняют старые маршруты).
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add routes.json index.html sitemap.xml
          git diff --staged --quiet \
            && echo "Маршруты не изменились, коммит не нужен" \
            || git commit -m "Обновление маршрутов $(date -u +%Y-%m-%d)"
          git push
